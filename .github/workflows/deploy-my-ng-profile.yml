name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master

# A newer master push supersedes any build or publish still in progress.
concurrency:
  group: my-ng-profile-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href=/my-ng-profile/

      - name: Copy index.html to 404.html
        run: cp ./dist/my-ng-profile/browser/index.html ./dist/my-ng-profile/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PUBLISH_TOKEN }}
          publish_dir: ./dist/my-ng-profile/browser
