<section class='hero'>
  <div class='hero-copy'>
    <p class='eyebrow'>Software developer · Philippines</p>
    <h1 class='hero-title'>I turn tedious work into simple software.</h1>
    <p class='hero-intro'>{{ user.bio }}</p>

    <div class='social-links'>
      @for (link of user.socialLinks; track link.name) {
        <a [href]='link.url' target='_blank' rel='noopener noreferrer' class='social-link'>
          {{ link.name }}<span class='social-arrow' aria-hidden='true'>↗</span>
        </a>
      }
    </div>
  </div>

  <div class='hero-portrait-wrap'>
    <img
      [src]='user.avatarUrl'
      width='180'
      height='180'
      alt='{{ user.name }}'
      class='hero-portrait'
      fetchpriority='high'
    />
  </div>
</section>

<section class='experience-strip' aria-labelledby='experience-title'>
  <h2 id='experience-title' class='section-label'>Experience</h2>
  <p class='company-list'>
    IBM <span class='company-separator'>/</span>
    Accenture <span class='company-separator'>/</span>
    Texas Instruments
  </p>
</section>
