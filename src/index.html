<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <title>Josh Piluden — Software Developer</title>
  <base href='/'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <meta name='description' content='Josh Piluden is a software developer in the Philippines building web apps and useful tools with .NET and Angular.'>
  <meta name='theme-color' content='#141416'>
  <meta name='color-scheme' content='dark light'>
  <link rel='icon' type='image/svg+xml' href='favicon.svg'>
  <script>
    // Set the saved theme before Angular boots; body is not available yet.
    (() => {
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        const stored = localStorage.getItem('app-theme');
        if (stored === 'light' || stored === 'dark') theme = stored;
      } catch {
        // Storage may be blocked.
      }
      document.documentElement.classList.add(theme);
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', theme === 'light' ? '#FAFAFA' : '#141416');
    })();
  </script>
  <style>
    body { margin: 0; background: #141416; color: #F5F5F7; }
    html.light body { background: #FAFAFA; color: #18181B; }
    .cold-start-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      background: inherit;
      font: 600 14px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -.02em;
    }
  </style>
</head>
<body>
  <app-root>
    <div class='cold-start-loader'>Josh Piluden</div>
  </app-root>
</body>
</html>
