<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <title>Josh Piluden — Software Developer</title>
  <base href='/'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <meta name='description' content='Josh Piluden is a software developer in the Philippines building web apps and useful tools with .NET and Angular.'>
  <meta name='theme-color' content='#f7f8f9'>
  <link rel='icon' type='image/svg+xml' href='favicon.svg'>
  <script>
    const storedTheme = localStorage.getItem('app-theme');
    if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');
    }
  </script>
  <style>
    body {
      margin: 0;
      background: #f7f8f9;
      color: #171a1f;
    }
    body.dark {
      background: #0e1114;
      color: #f1f3f5;
    }
    .cold-start-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      background: inherit;
      font: 600 14px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -.02em;
    }
  </style>
</head>
<body>
  <app-root>
    <div class='cold-start-loader'>Josh Piluden</div>
  </app-root>
</body>
</html>
